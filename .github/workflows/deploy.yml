name: Validate and publish static classroom pages

on:
  push:
    branches: [main, codex/lesson-one-profiles]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.cjs

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r backend/requirements.txt
      - name: Publish the static allowlist only
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: python .github/scripts/publish_site.py

  package-scf:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r backend/requirements.txt --target build/scf-dependencies
      - name: Verify Linux function imports before packaging
        env:
          PYTHONPATH: backend:build/scf-dependencies
        run: python -c "import index; import qcloud_cos; import Crypto.Cipher.AES"
      - run: python tools/build_scf.py build/scf-dependencies build/lesson-one-scf.zip
      - run: python tools/stage_site.py build/frontend
      - run: cd build/frontend && zip -r ../caitian-ai-frontend.zip caitian-ai
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-one-scf
          path: |
            build/lesson-one-scf.zip
            build/caitian-ai-frontend.zip
            docs/lesson-one-deployment.md
            docs/verification-2026-11-11.md
            deploy/*.json
          retention-days: 7
