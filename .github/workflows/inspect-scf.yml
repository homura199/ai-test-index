name: Inspect existing SCF integration

on:
  workflow_dispatch:
  push:
    branches: [codex/lesson-one-profiles]
    paths:
      - .github/workflows/inspect-scf.yml
      - .github/scripts/inspect_scf.py

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'tencentcloud-sdk-python>=3.0,<4'
      - name: Read function metadata without credentials or source code
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
        run: python .github/scripts/inspect_scf.py
